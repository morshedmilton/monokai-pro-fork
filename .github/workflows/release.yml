name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v2.0.15-fork)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Verify package.json
        run: |
          echo "Package name: $(cat package.json | grep '"name"' | head -1)"
          echo "Package version: $(cat package.json | grep '"version"' | head -1)"

      - name: Package extension
        run: vsce package --no-dependencies --out theme-monokai-pro-fork-${{ github.ref_name }}.vsix

      - name: Verify VSIX
        run: |
          ls -la *.vsix
          unzip -l theme-monokai-pro-fork-${{ github.ref_name }}.vsix | head -20

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: theme-monokai-pro-fork-${{ github.ref_name }}.vsix
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload VSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: '*.vsix'
          retention-days: 30

  publish-marketplace:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-package
          path: .

      - name: Publish to VS Code Marketplace
        run: vsce publish -p $VSCE_PAT
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}